name: audio_studio
description: Buscar, baixar, converter e editar áudio em uma timeline multifaixa
publish_to: none
version: 2.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  dio: ^5.7.0
  just_audio: ^0.9.40
  just_audio_media_kit: ^2.0.4
  media_kit_libs_linux: ^1.1.3
  media_kit_libs_windows_audio: ^1.0.9
  path_provider: ^2.1.4
  path: ^1.9.0
  file_picker: ^8.1.2
  youtube_explode_dart: ^2.3.0
  provider: ^6.1.2
  archive: ^4.5.0
  image: ^4.11.1
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets: 
    - assets/icons/audio_studio.png
  
flutter_launcher_icons:
  android: true
  ios: true
  linux: true
  image_path: "assets/icons/audio_studio.png"
  adaptive_icon_background: "#080810"
  adaptive_icon_foreground: "assets/icons/audio_studio.png"